[project]
name = "lesson-assistant"
version = "0.1.0"
description = "可追踪、可编辑和可恢复的教师教案助手"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1", "asyncpg>=0.29,<1", "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3", "pyjwt>=2.9,<3", "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.27,<1", "arq>=0.26,<1", "python-multipart>=0.0.18,<1",
  "python-docx>=1.1,<2", "reportlab>=4.2,<5", "pypdf>=5,<7", "bleach>=6.1,<7",
  "markdown-it-py>=3,<5", "mdit-py-plugins>=0.4,<1", "latex2mathml>=3.77,<4", "sympy>=1.13,<2",
  "jsonschema>=4.23,<5", "lxml>=5,<7", "pypdfium2>=5,<6", "pillow>=11,<13"
]

[project.optional-dependencies]
cos = ["cos-python-sdk-v5>=1.9,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.uv]
package = false
